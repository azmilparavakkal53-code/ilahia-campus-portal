services:
  - type: web
    name: ilahia-campus-portal
    runtime: node
    plan: free
    rootDir: .
    buildCommand: node --check server.js
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CAMPUS_ACCOUNTS_JSON
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GATEPASS_CODE_SECRET
        generateValue: true
