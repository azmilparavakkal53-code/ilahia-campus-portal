services:
  - type: web
    name: ilahia-campus-portal
    runtime: node
    plan: free
    rootDir: .
    buildCommand: node --check server.js
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TEACHER_ID
        sync: false
      - key: TEACHER_PASSWORD
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

